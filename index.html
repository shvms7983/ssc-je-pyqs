<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSC JE Mechanical CBT Portal | Pro Exam Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f1f5f9;
      --surface: #ffffff;
      --dark-navy: #0f172a;
      --header-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      
      /* CBT Status Colors */
      --cbt-green: #16a34a;
      --cbt-green-bg: #f0fdf4;
      --cbt-red: #dc2626;
      --cbt-red-bg: #fef2f2;
      --cbt-purple: #7c3aed;
      --cbt-purple-bg: #f5f3ff;
      
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 6px;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

    /* Ultra-Pro NTA Header */
    header {
      background: var(--header-bg);
      color: #ffffff;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      border-bottom: 2px solid var(--accent);
      position: relative;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-badge {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.8px;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
    }

    .brand-info { display: flex; flex-direction: column; }
    .brand-title { font-size: 1.15rem; font-weight: 700; color: #f8fafc; letter-spacing: 0.3px; }
    .brand-sub { font-size: 0.72rem; color: #94a3b8; display: flex; align-items: center; gap: 6px; margin-top: 2px; }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      display: inline-block;
    }

    .header-right { display: flex; align-items: center; gap: 18px; }

    .mode-switch {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    .mode-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      color: #94a3b8;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }

    .timer-box {
      background: rgba(124, 45, 18, 0.85);
      color: #ffedd5;
      padding: 7px 16px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid #ea580c;
      box-shadow: 0 0 10px rgba(234, 88, 12, 0.3);
      display: none;
      letter-spacing: 0.5px;
    }

    /* App Layout */
    .app-layout {
      max-width: 1400px;
      margin: 16px auto;
      width: 96%;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      flex: 1;
    }

    .main-area { display: flex; flex-direction: column; gap: 12px; }

    .filter-bar {
      background: var(--surface);
      padding: 10px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .select-label { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-right: 8px; }
    select { padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 0.88rem; font-weight: 600; background: var(--surface); color: var(--text-dark); cursor: pointer; outline: none; }

    .cbt-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .cbt-header {
      background: #f8fafc;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .badge-pyq { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-weight: 700; }

    .question-container { padding: 24px; flex: 1; }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .q-number-title { font-size: 0.85rem; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }

    .btn-bm { background: transparent; border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .btn-bm.active { background: #fef3c7; border-color: #f59e0b; color: #b45309; }

    .q-text { font-size: 1.1rem; font-weight: 600; color: var(--text-dark); line-height: 1.6; margin-bottom: 16px; }

    /* Diagram Frame Styling */
    .img-box {
      margin: 12px 0 20px 0;
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border-light);
      padding: 8px;
      background: #fafafa;
      display: none;
    }
    .img-box img {
      max-width: 100%;
      max-height: 360px;
      display: block;
      margin: 0 auto;
      border-radius: 4px;
    }

    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .opt-btn {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-dark);
      transition: all 0.15s ease;
      text-align: left;
    }
    .opt-prefix {
      font-weight: 700;
      background: #f1f5f9;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 0.82rem;
      flex-shrink: 0;
      border: 1px solid var(--border-light);
    }
    .opt-btn:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
    .opt-btn.selected-exam { border-color: var(--accent); background: #eff6ff; font-weight: 600; }
    
    .opt-btn.correct { background: var(--cbt-green-bg) !important; border-color: var(--cbt-green) !important; color: #14532d !important; font-weight: 600; }
    .opt-btn.correct .opt-prefix { background: var(--cbt-green); color: white; border-color: var(--cbt-green); }
    
    .opt-btn.wrong { background: var(--cbt-red-bg) !important; border-color: var(--cbt-red) !important; color: #7f1d1d !important; font-weight: 600; }
    .opt-btn.wrong .opt-prefix { background: var(--cbt-red); color: white; border-color: var(--cbt-red); }

    .solution-drawer {
      display: none;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-left: 4px solid #0284c7;
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      font-size: 0.92rem;
      line-height: 1.55;
      color: #0c4a6e;
    }
    .sol-title { font-weight: 700; margin-bottom: 6px; color: #0284c7; display: flex; align-items: center; gap: 6px; }

    .cbt-footer {
      padding: 12px 20px;
      background: #f8fafc;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group { display: flex; gap: 8px; }
    .cbt-btn {
      padding: 9px 18px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dark);
      transition: 0.15s;
    }
    .cbt-btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .cbt-btn-primary:hover { background: var(--accent-hover); }
    .cbt-btn-purple { background: var(--cbt-purple); color: white; border-color: var(--cbt-purple); }
    .cbt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Right Palette Box */
    .palette-area {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: fit-content;
    }
    .palette-head { font-weight: 700; font-size: 0.9rem; margin-bottom: 12px; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; color: var(--text-dark); }
    
    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.75rem; margin-bottom: 14px; border-bottom: 1px solid var(--border-light); padding-bottom: 12px; color: var(--text-muted); }
    .lg-item { display: flex; align-items: center; gap: 6px; }
    .lg-box { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }

    .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 380px; overflow-y: auto; padding-right: 2px; }
    .p-node {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      transition: 0.15s;
    }
    .p-node:hover { border-color: var(--accent); }
    .p-node.curr { border: 2px solid var(--dark-navy) !important; font-weight: 800; }
    
    .p-node.answered { background: var(--cbt-green); color: white; border-color: var(--cbt-green); }
    .p-node.wrong-ans { background: var(--cbt-red); color: white; border-color: var(--cbt-red); }
    .p-node.marked { background: var(--cbt-purple); color: white; border-color: var(--cbt-purple); }

    @media (max-width: 900px) {
      .app-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Modern NTA Header -->
  <header>
    <div class="brand">
      <span class="brand-badge">SSC JE ME</span>
      <div class="brand-info">
        <span class="brand-title">Mechanical Engineering CBT Portal</span>
        <span class="brand-sub"><span class="status-dot"></span> LIVE TEST SERVER 01 • CBT EXAM ENGINE</span>
      </div>
    </div>
    
    <div class="header-right">
      <div class="mode-switch">
        <button class="mode-btn active" id="btn-practice" onclick="setEngineMode('practice')">
          <span>📖</span> Practice Mode
        </button>
        <button class="mode-btn" id="btn-exam" onclick="setEngineMode('exam')">
          <span>⏱️</span> Mock CBT Exam
        </button>
      </div>
      <div class="timer-box" id="timer-display">⏱️ 120:00</div>
    </div>
  </header>

  <!-- App Structure -->
  <div class="app-layout">
    
    <div class="main-area">
      
      <div class="filter-bar">
        <div>
          <span class="select-label">SUBJECT:</span>
          <select id="subject-select" onchange="applyFilters()">
            <option value="all">All Mechanical Core Subjects</option>
            <option value="Thermodynamics">Thermodynamics</option>
            <option value="Fluid Mechanics">Fluid Mechanics & Hydraulics</option>
            <option value="Strength of Materials">Strength of Materials (SOM)</option>
            <option value="Theory of Machines">Theory of Machines (TOM)</option>
            <option value="Manufacturing">Manufacturing & Production</option>
            <option value="Engineering Mechanics">Engineering Mechanics</option>
            <option value="IC Engine">IC Engines & Power Plant</option>
          </select>
        </div>
        <button class="btn-bm" id="bm-filter-btn" onclick="toggleBookmarkedOnly()">🔖 Saved Questions (<span id="bm-count">0</span>)</button>
      </div>

      <div class="cbt-card" id="quiz-card">
        <div class="cbt-header">
          <span id="subject-tag">Subject: Loading...</span>
          <span class="badge-pyq" id="year-tag">PYQ Year: --</span>
        </div>

        <div class="question-container">
          <div class="q-meta">
            <span class="q-number-title" id="progress-text">QUESTION 1</span>
            <button class="btn-bm" id="bm-toggle-btn" onclick="toggleCurrentBookmark()">🔖 Bookmark Question</button>
          </div>
          <div class="q-text" id="question">Questions loading...</div>

          <!-- Question Diagram Container -->
          <div class="img-box" id="q-img-box">
            <img id="q-img" src="" alt="Question Diagram">
          </div>

          <div class="options-grid" id="options-container"></div>

          <!-- Solution & Explanation Diagram Container -->
          <div class="solution-drawer" id="solution-box">
            <div class="sol-title">💡 Detailed Technical Solution</div>
            <div id="explanation-text">Explanation...</div>
            <div class="img-box" id="exp-img-box" style="margin-top: 12px; margin-bottom: 0;">
              <img id="exp-img" src="" alt="Explanation Diagram">
            </div>
          </div>
        </div>

        <!-- CBT Action Footer -->
        <div class="cbt-footer">
          <div class="btn-group">
            <button class="cbt-btn" id="clear-btn" onclick="clearResponse()">Clear Response</button>
            <button class="cbt-btn cbt-btn-purple" id="mark-btn" onclick="markForReview()">Mark for Review</button>
          </div>
          <div class="btn-group">
            <button class="cbt-btn" id="prev-btn" onclick="prevQuestion()" disabled>⬅️ Previous</button>
            <button class="cbt-btn cbt-btn-primary" id="next-btn" onclick="nextQuestion()">Save & Next ➔</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Right Palette -->
    <div class="palette-area">
      <div class="palette-head">Question Navigation Palette</div>
      
      <div class="legend-grid">
        <div class="lg-item"><div class="lg-box" style="background:var(--cbt-green);"></div> Correct / Ans</div>
        <div class="lg-item"><div class="lg-box" style="background:var(--cbt-red);"></div> Wrong</div>
        <div class="lg-item"><div class="lg-box" style="background:var(--cbt-purple);"></div> Review</div>
        <div class="lg-item"><div class="lg-box" style="background:#f8fafc;"></div> Unattempted</div>
      </div>

      <div class="palette-grid" id="palette-grid"></div>
    </div>

  </div>

<script>
  let rawQuestions = [];
  let filteredQuestions = [];
  let currentIdx = 0;
  let engineMode = 'practice';
  let userAnswers = {}; 
  let answerStatus = {}; 
  let bookmarks = JSON.parse(localStorage.getItem('ssc_me_bookmarks') || '[]');
  let timerInterval;
  let timeRemaining = 120 * 60;

  async function initEngine() {
    try {
      const response = await fetch('questions.json');
      rawQuestions = await response.json();
      
      rawQuestions.sort((a, b) => (a.year || 0) - (b.year || 0));

      updateBookmarkCount();
      applyFilters();
    } catch (err) {
      document.getElementById("question").innerText = "Error: questions.json file nahi mili ya JSON formatting incorrect hai!";
    }
  }

  function setEngineMode(mode) {
    engineMode = mode;
    document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
    document.getElementById('btn-exam').classList.toggle('active', mode === 'exam');
    document.getElementById('timer-display').style.display = mode === 'exam' ? 'block' : 'none';
    
    if(mode === 'exam') startTimer();
    else clearInterval(timerInterval);
    
    showQuestion();
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeRemaining--;
      let mins = Math.floor(timeRemaining / 60);
      let secs = timeRemaining % 60;
      document.getElementById('timer-display').innerText = `⏱️ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
      if(timeRemaining <= 0) {
        clearInterval(timerInterval);
        submitExam();
      }
    }, 1000);
  }

  function applyFilters() {
    const subject = document.getElementById('subject-select').value;
    filteredQuestions = rawQuestions.filter(q => (subject === 'all') || (q.subject && q.subject.toLowerCase() === subject.toLowerCase()));

    currentIdx = 0;
    if(filteredQuestions.length > 0) {
      showQuestion();
    } else {
      document.getElementById("question").innerText = "Is subject mein koi questions nahi hain.";
      document.getElementById("options-container").innerHTML = "";
    }
  }

  function renderPalette() {
    const pGrid = document.getElementById('palette-grid');
    pGrid.innerHTML = "";

    filteredQuestions.forEach((q, idx) => {
      const btn = document.createElement('div');
      btn.className = `p-node ${idx === currentIdx ? 'curr' : ''}`;
      btn.innerText = idx + 1;

      if(answerStatus[idx] === 'correct') btn.classList.add('answered');
      else if(answerStatus[idx] === 'wrong') btn.classList.add('wrong-ans');
      else if(answerStatus[idx] === 'marked') btn.classList.add('marked');

      btn.onclick = () => {
        currentIdx = idx;
        showQuestion();
      };
      pGrid.appendChild(btn);
    });
  }

  function showQuestion() {
    if(filteredQuestions.length === 0) return;
    const q = filteredQuestions[currentIdx];

    document.getElementById("progress-text").innerText = `QUESTION ${currentIdx + 1} OF ${filteredQuestions.length}`;
    document.getElementById("question").innerText = q.question;
    document.getElementById("subject-tag").innerText = "Subject: " + (q.subject || "Mechanical Core");
    document.getElementById("year-tag").innerText = "PYQ Year: " + (q.year || "N/A");

    // Question Image Loader
    const qImgBox = document.getElementById("q-img-box");
    const qImg = document.getElementById("q-img");
    if (q.image) {
      qImg.src = q.image;
      qImgBox.style.display = "block";
    } else {
      qImgBox.style.display = "none";
    }

    const optsContainer = document.getElementById("options-container");
    const solBox = document.getElementById("solution-box");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const bmBtn = document.getElementById("bm-toggle-btn");

    optsContainer.innerHTML = "";
    solBox.style.display = "none";
    prevBtn.disabled = currentIdx === 0;

    const isBm = bookmarks.some(b => b.question === q.question);
    bmBtn.classList.toggle('active', isBm);

    const prefixes = ["A", "B", "C", "D"];

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerHTML = `<span class="opt-prefix">${prefixes[idx]}</span> <span>${opt}</span>`;
      
      if(engineMode === 'practice') {
        if(userAnswers[currentIdx] !== undefined) {
          btn.disabled = true;
          if(idx === q.answer) btn.classList.add('correct');
          if(idx === userAnswers[currentIdx] && idx !== q.answer) btn.classList.add('wrong');
        } else {
          btn.onclick = () => selectOptionPractice(idx, q.answer, q.explanation);
        }
      } else {
        if(userAnswers[currentIdx] === idx) btn.classList.add('selected-exam');
        btn.onclick = () => selectOptionExam(idx);
      }

      optsContainer.appendChild(btn);
    });

    // Explanation Loader
    if(userAnswers[currentIdx] !== undefined && engineMode === 'practice') {
      document.getElementById("explanation-text").innerText = q.explanation ? q.explanation : "Detailed explanation for this question will be uploaded shortly.";
      
      const expImgBox = document.getElementById("exp-img-box");
      const expImg = document.getElementById("exp-img");
      if (q.explanation_image) {
        expImg.src = q.explanation_image;
        expImgBox.style.display = "block";
      } else {
        expImgBox.style.display = "none";
      }

      solBox.style.display = "block";
    }

    if(currentIdx === filteredQuestions.length - 1) nextBtn.innerText = engineMode === 'exam' ? "Submit Test 🏁" : "Finish Set 🏁";
    else nextBtn.innerText = "Save & Next ➔";

    renderPalette();
  }

  function selectOptionPractice(selected, correct, exp) {
    userAnswers[currentIdx] = selected;
    answerStatus[currentIdx] = (selected === correct) ? 'correct' : 'wrong';
    showQuestion();
  }

  function selectOptionExam(selected) {
    userAnswers[currentIdx] = selected;
    answerStatus[currentIdx] = 'correct';
    showQuestion();
  }

  function clearResponse() {
    delete userAnswers[currentIdx];
    delete answerStatus[currentIdx];
    showQuestion();
  }

  function markForReview() {
    answerStatus[currentIdx] = 'marked';
    nextQuestion();
  }

  function nextQuestion() {
    if(currentIdx < filteredQuestions.length - 1) {
      currentIdx++;
      showQuestion();
    } else {
      if(engineMode === 'exam') submitExam();
      else alert("Practice set complete!");
    }
  }

  function prevQuestion() {
    if(currentIdx > 0) {
      currentIdx--;
      showQuestion();
    }
  }

  function toggleCurrentBookmark() {
    const q = filteredQuestions[currentIdx];
    const idx = bookmarks.findIndex(b => b.question === q.question);
    if(idx > -1) bookmarks.splice(idx, 1);
    else bookmarks.push(q);
    
    localStorage.setItem('ssc_me_bookmarks', JSON.stringify(bookmarks));
    updateBookmarkCount();
    showQuestion();
  }

  function updateBookmarkCount() {
    document.getElementById('bm-count').innerText = bookmarks.length;
  }

  function toggleBookmarkedOnly() {
    if(bookmarks.length === 0) { alert("Koi question bookmarked nahi hai!"); return; }
    filteredQuestions = bookmarks;
    currentIdx = 0;
    showQuestion();
  }

  function submitExam() {
    clearInterval(timerInterval);
    let score = 0, correct = 0, wrong = 0, unattempted = 0;

    filteredQuestions.forEach((q, idx) => {
      let ans = userAnswers[idx];
      if(ans === undefined) unattempted++;
      else if(ans === q.answer) { correct++; score += 1.0; }
      else { wrong++; score -= 0.25; }
    });

    let accuracy = (correct + wrong) > 0 ? ((correct / (correct + wrong)) * 100).toFixed(1) : 0;

    document.getElementById('quiz-card').innerHTML = `
      <div style="padding:40px; text-align:center;">
        <h2 style="margin-bottom:20px; font-size:1.4rem; color:var(--dark-navy);">📊 Official Performance Report</h2>
        <div style="display:flex; justify-content:center; gap:15px; margin-bottom:25px;">
          <div style="background:#f8fafc; padding:15px 25px; border-radius:6px; border:1px solid var(--border);">
            <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">TOTAL SCORE</div>
            <div style="font-size:1.6rem; font-weight:800; color:var(--accent);">${score.toFixed(2)}</div>
          </div>
          <div style="background:#f8fafc; padding:15px 25px; border-radius:6px; border:1px solid var(--border);">
            <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">ACCURACY</div>
            <div style="font-size:1.6rem; font-weight:800; color:var(--cbt-green);">${accuracy}%</div>
          </div>
        </div>
        <button class="cbt-btn cbt-btn-primary" onclick="location.reload()">Re-attempt Test 🔄</button>
      </div>
    `;
  }

  initEngine();
</script>

</body>
</html>
